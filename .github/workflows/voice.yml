name: voice-tts
# Text-to-speech for reels. The cloud workspace can't reach the TTS service, GitHub runners can.
# Add voice/queue/<name>.txt (first line may be "#voice: az-AZ-BanuNeural", default az-AZ-BabekNeural;
# optional "#rate: +5%"), push -> voice/out/<name>.mp3 + <name>.vtt (word timings) within ~1 min.
on:
  push:
    paths: ["voice/queue/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts==7.0.2
      - name: Synthesize queued texts
        run: |
          mkdir -p voice/out
          for f in voice/queue/*.txt; do
            [ -e "$f" ] || continue
            n=$(basename "$f" .txt)
            [ -f "voice/out/$n.mp3" ] && continue
            v=$(grep -m1 '^#voice:' "$f" | cut -d: -f2 | tr -d ' '); v=${v:-az-AZ-BabekNeural}
            r=$(grep -m1 '^#rate:' "$f" | cut -d: -f2 | tr -d ' '); r=${r:-+0%}
            grep -v '^#' "$f" > /tmp/t.txt
            edge-tts --voice "$v" --rate="$r" -f /tmp/t.txt --write-media "voice/out/$n.mp3" --write-subtitles "voice/out/$n.vtt" || echo "failed $n"
          done
      - name: Commit
        run: |
          git config user.name "voice-bot"; git config user.email "noreply@github.com"
          git add voice/out
          git diff --cached --quiet || git commit -m "TTS voice files"
          git pull --rebase && git push
